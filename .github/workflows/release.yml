name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # (required) Comma-separated list of binary names (non-extension portion of filename) to build and upload.
          # Note that glob pattern is not supported yet.
          bin: cc-downloader
          # (optional) Target triple, default is host triple.
          # This is optional but it is recommended that this always be set to
          # clarify which target you are building for if macOS is included in
          # the matrix because GitHub Actions changed the default architecture
          # of macos-latest since macos-14.
          target: ${{ matrix.target }}
          # (optional) Archive name (non-extension portion of filename) to be uploaded.
          # [default value: $bin-$target]
          # [possible values: the following variables and any string]
          #   variables:
          #     - $bin    - Binary name (non-extension portion of filename).
          #     - $target - Target triple.
          #     - $tag    - Tag of this release.
          # When multiple binary names are specified, default archive name or $bin variable cannot be used.
          archive: $bin-$tag-$target
          # (optional) On which platform to distribute the `.tar.gz` file.
          # [default value: unix]
          # [possible values: all, unix, windows, none]
          tar: unix
          # (optional) On which platform to distribute the `.zip` file.
          # [default value: windows]
          # [possible values: all, unix, windows, none]
          zip: windows
          # (optional) Comma-separated list of additional files to be included to archive.
          # Note that glob pattern is not supported yet.
          include: LICENSE-APACHE,LICENSE-MIT,README.md
          # (optional) Checksums to release with the asset.
          checksum: sha512
          # (required) GitHub token for uploading assets to GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  # --- Python bindings: build the maturin/PyO3 wheels, then publish to PyPI ---
  # The bindings live in python/ and use abi3-py312, so one stable-ABI wheel per
  # platform covers all Python >= 3.12. This mirrors the Rust binary targets above.
  build-wheels:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 (not the `auto`/manylinux2014 default): its GCC 12
          # toolchain can cross-compile aws-lc-sys's ARMv8 crypto for the aarch64
          # wheel. Trade-off: the wheels require glibc >= 2.28.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: 2_28
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: 2_28
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set wheel version from tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*([.+-].*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version"; exit 1
          fi
          echo "Setting cc-downloader-python version to $version"
          python -c "import re,sys,pathlib; p=pathlib.Path('python/Cargo.toml'); t,n=re.subn(r'(?m)^(\s*version\s*=\s*)\"[^\"]*\"', r'\1\"'+sys.argv[1]+'\"', p.read_text(), count=1); assert n==1, 'version line not found'; p.write_text(t)" "$version"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: python/dist

  build-sdist:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set sdist version from tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*([.+-].*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version"; exit 1
          fi
          echo "Setting cc-downloader-python version to $version"
          python -c "import re,sys,pathlib; p=pathlib.Path('python/Cargo.toml'); t,n=re.subn(r'(?m)^(\s*version\s*=\s*)\"[^\"]*\"', r'\1\"'+sys.argv[1]+'\"', p.read_text(), count=1); assert n==1, 'version line not found'; p.write_text(t)" "$version"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/dist

  publish-pypi:
    needs: [ build-wheels, build-sdist ]
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no API token. Requires a one-time "trusted
    # publisher" entry on PyPI for this repo + workflow.
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist